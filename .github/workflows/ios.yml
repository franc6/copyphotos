name: iOS

on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  copycore-tests:
    name: CopyCore unit tests
    runs-on: xcode-27
    defaults:
      run:
        working-directory: ios/CopyCore
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: xcodebuild -version && swift --version
      - name: swift test
        run: swift test

  build-app:
    name: Build app (simulator, unsigned)
    runs-on: xcode-27
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: Cache SwiftPM packages
        uses: actions/cache@v4
        with:
          path: ios/.spm
          key: spm-${{ runner.os }}-${{ hashFiles('ios/**/Package.resolved', 'ios/**/project.pbxproj') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project CopyPhotos.xcodeproj \
            -scheme CopyPhotos \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -clonedSourcePackagesDirPath .spm \
            CODE_SIGNING_ALLOWED=NO \
            | tee xcodebuild.log

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: ios/xcodebuild.log
