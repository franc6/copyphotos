name: Release

# Runs on every pushed tag (e.g. `git tag -a v1.2.0 -m "What's new" && git push origin v1.2.0`).
# Tests both apps, then:
#   - GitHub release with the APK (every tag)
#   - Google Play production (plain version tags, when Play secrets are set)
#   - App Store review + automatic release (plain version tags, when Apple secrets are set)
# play-refresh.yml also dispatches this workflow on a tag to keep the Play listing fresh.

on:
  push:
    tags: ["*"]
  workflow_dispatch:
    inputs:
      app_store:
        description: Submit to the App Store
        type: boolean
        default: true
      play:
        description: Publish to Google Play
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  meta:
    name: Version and release notes
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.meta.outputs.version_name }}
      version_code: ${{ steps.meta.outputs.version_code }}
      plain: ${{ steps.meta.outputs.plain }}
      notes: ${{ steps.meta.outputs.notes }}
    steps:
      - name: Require a tag
        if: github.ref_type != 'tag'
        run: |
          echo "::error::Run this workflow on a tag (choose the tag in 'Use workflow from')."
          exit 1

      - uses: actions/checkout@v4

      - id: meta
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          echo "version_name=$VERSION" >> "$GITHUB_OUTPUT"
          # Minutes since the epoch: increases across workflows and reruns, and is
          # shared by the APK, the AAB and the iOS build number.
          echo "version_code=$(( $(date +%s) / 60 ))" >> "$GITHUB_OUTPUT"
          if printf '%s' "$VERSION" | grep -Eq '^[0-9]+(\.[0-9]+){0,2}$'; then
            echo "plain=true" >> "$GITHUB_OUTPUT"
          else
            echo "plain=false" >> "$GITHUB_OUTPUT"
          fi

          # Release notes: the annotated tag's message. actions/checkout doesn't
          # keep the tag object, so fetch it.
          git fetch --force --depth=1 origin "refs/tags/$TAG:refs/tags/$TAG"
          NOTES=""
          if [ "$(git cat-file -t "$TAG")" = "tag" ]; then
            NOTES="$(git tag -l --format='%(contents)' "$TAG" | sed '/-----BEGIN PGP SIGNATURE-----/,$d')"
          fi
          if [ -z "$(printf '%s' "$NOTES" | tr -d '[:space:]')" ]; then
            NOTES="Bug fixes and improvements."
          fi
          { echo "notes<<RELEASE_NOTES_END"; printf '%s\n' "$NOTES"; echo "RELEASE_NOTES_END"; } >> "$GITHUB_OUTPUT"

  android-tests:
    uses: ./.github/workflows/android.yml

  ios-tests:
    uses: ./.github/workflows/ios.yml

  build-android:
    name: Build release APK and AAB
    environment: release
    needs: [meta, android-tests]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    outputs:
      signed: ${{ steps.keystore.outputs.signed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Decode signing keystore
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set; the release will use a debug-signed APK and skip Google Play."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          TAG: ${{ github.ref_name }}
          VERSION_NAME: ${{ needs.meta.outputs.version_name }}
          VERSION_CODE: ${{ needs.meta.outputs.version_code }}
        run: |
          if [ "${{ steps.keystore.outputs.signed }}" = "true" ]; then
            TASKS="assembleRelease bundleRelease"; VARIANT=release
          else
            TASKS="assembleDebug"; VARIANT=debug
          fi
          ./gradlew --no-daemon $TASKS -PversionName="$VERSION_NAME" -PversionCode="$VERSION_CODE"
          mkdir -p ../dist ../play
          cp "app/build/outputs/apk/$VARIANT/app-$VARIANT.apk" "../dist/CopyPhotos-$TAG.apk"
          (cd ../dist && sha256sum "CopyPhotos-$TAG.apk" > "CopyPhotos-$TAG.apk.sha256")
          if [ "$VARIANT" = release ]; then
            cp app/build/outputs/bundle/release/app-release.aab "../play/CopyPhotos-$TAG.aab"
            # R8's name map. Play reads it from inside the AAB; this copy decodes crash
            # reports from the APK published here.
            mkdir -p ../mapping
            cp app/build/outputs/mapping/release/mapping.txt "../mapping/CopyPhotos-$TAG-mapping.txt"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: dist/

      - uses: actions/upload-artifact@v4
        if: steps.keystore.outputs.signed == 'true'
        with:
          name: release-aab
          path: play/

      - uses: actions/upload-artifact@v4
        if: steps.keystore.outputs.signed == 'true'
        with:
          name: release-mapping
          path: mapping/

  google-play:
    name: Publish to Google Play
    environment: release
    needs: [meta, build-android]
    if: >-
      needs.meta.outputs.plain == 'true' &&
      needs.build-android.outputs.signed == 'true' &&
      (github.event_name == 'push' || inputs.play)
    runs-on: ubuntu-latest
    steps:
      - name: Check for Play credentials
        id: gate
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::warning::PLAY_SERVICE_ACCOUNT_JSON is not set; skipping Google Play."
            echo "ship=false" >> "$GITHUB_OUTPUT"
          else
            echo "ship=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.ship == 'true'

      - uses: actions/download-artifact@v4
        if: steps.gate.outputs.ship == 'true'
        with:
          name: release-aab
          path: play

      - uses: ruby/setup-ruby@b1da4809b005e0178fe08a1d57317bffc00b7b4c # v1.332.0
        if: steps.gate.outputs.ship == 'true'
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Upload to the production track
        if: steps.gate.outputs.ship == 'true'
        working-directory: android
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          PLAY_LANGUAGE: ${{ vars.PLAY_LANGUAGE || 'en-US' }}
          VERSION_CODE: ${{ needs.meta.outputs.version_code }}
          NOTES: ${{ needs.meta.outputs.notes }}
        run: |
          META="$RUNNER_TEMP/play-metadata"
          mkdir -p "$META/$PLAY_LANGUAGE/changelogs"
          # Play limits "What's new" to 500 characters.
          printf '%s' "$NOTES" | head -c 500 > "$META/$PLAY_LANGUAGE/changelogs/$VERSION_CODE.txt"
          export PLAY_METADATA_PATH="$META"
          export AAB_PATH="$(ls "$GITHUB_WORKSPACE"/play/*.aab)"
          bundle exec fastlane android play

  app-store:
    name: Submit to App Store
    environment: release
    needs: [meta, ios-tests]
    if: >-
      needs.meta.outputs.plain == 'true' &&
      (github.event_name == 'push' || inputs.app_store)
    runs-on: xcode-27
    steps:
      - name: Check for Apple credentials
        id: gate
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          if [ -z "$ASC_KEY_ID" ]; then
            echo "::warning::App Store secrets are not configured; skipping App Store submission."
            echo "ship=false" >> "$GITHUB_OUTPUT"
          else
            echo "ship=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.ship == 'true'

      - uses: ruby/setup-ruby@b1da4809b005e0178fe08a1d57317bffc00b7b4c # v1.332.0
        if: steps.gate.outputs.ship == 'true'
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Decode distribution certificate
        if: steps.gate.outputs.ship == 'true'
        env:
          DIST_CERT_P12_BASE64: ${{ secrets.APPLE_DIST_CERT_P12_BASE64 }}
        run: |
          echo "$DIST_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          echo "DIST_CERT_P12_PATH=$RUNNER_TEMP/dist.p12" >> "$GITHUB_ENV"

      - name: Build, upload, submit for review
        if: steps.gate.outputs.ship == 'true'
        working-directory: ios
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          DIST_CERT_PASSWORD: ${{ secrets.APPLE_DIST_CERT_PASSWORD }}
          APP_VERSION: ${{ needs.meta.outputs.version_name }}
          BUILD_NUMBER: ${{ needs.meta.outputs.version_code }}
          RELEASE_NOTES: ${{ needs.meta.outputs.notes }}
        run: bundle exec fastlane ios release

      - name: Upload build logs
        if: failure() && steps.gate.outputs.ship == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-store-logs
          path: |
            ~/Library/Logs/gym/
            ios/fastlane/report.xml
          if-no-files-found: ignore

  github-release:
    name: Publish GitHub release
    needs: [meta, build-android, ios-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: release-apk
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          SIGNED: ${{ needs.build-android.outputs.signed }}
          NOTES: ${{ needs.meta.outputs.notes }}
        run: |
          printf '%s\n' "$NOTES" > notes.md
          if [ "$SIGNED" != "true" ]; then
            printf '\n%s\n' "> **Note:** this APK is signed with a debug key (no release keystore is configured)." >> notes.md
          fi
          PRERELEASE=""
          case "$TAG" in *-*) PRERELEASE="--prerelease" ;; esac
          gh release create "$TAG" dist/* --title "CopyPhotos $TAG" --verify-tag \
            --notes-file notes.md --generate-notes $PRERELEASE
